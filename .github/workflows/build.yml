name: Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '构建目标'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - jar
          - injector

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-archives,readwrite"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve git revision
        id: rev
        shell: pwsh
        run: |
          $sha = git rev-parse --short=7 HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Build revision: $sha"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ===== JAR 构建 =====
      - name: Build JAR
        if: inputs.build_target == 'all' || inputs.build_target == 'jar'
        shell: pwsh
        run: .\gradlew.bat --no-daemon jar

      - name: Upload JAR
        if: inputs.build_target == 'all' || inputs.build_target == 'jar'
        uses: actions/upload-artifact@v4
        with:
          name: OpenZen-${{ steps.rev.outputs.sha }}.jar
          path: build/libs/hey-1.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload JAR mapping
        if: inputs.build_target == 'all' || inputs.build_target == 'jar'
        uses: actions/upload-artifact@v4
        with:
          name: OpenZen-${{ steps.rev.outputs.sha }}-jar-mapping.txt
          path: build/rename-mapping.txt
          if-no-files-found: error
          retention-days: 30

      # ===== 注入器构建 =====
      - name: Setup MSVC (x64)
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone & bootstrap vcpkg
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        shell: pwsh
        run: |
          $vcpkgTag = '2026.04.27'
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          if (Test-Path $vcpkg) {
              Write-Host "Reusing existing $vcpkg"
          } else {
              git clone --depth=1 --branch $vcpkgTag https://github.com/microsoft/vcpkg.git $vcpkg
          }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg.exe" version
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg installed + archives
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        uses: actions/cache@v4
        with:
          path: |
            vcpkg\installed
            vcpkg-archives
          key: vcpkg-qt-${{ runner.os }}-${{ hashFiles('native/vcpkg.json') }}
          restore-keys: |
            vcpkg-qt-${{ runner.os }}-

      - name: Install UPX
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        shell: pwsh
        run: choco install upx -y --no-progress

      - name: Build Injector (DLL + EXE)
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        shell: pwsh
        env:
          OPENZEN_BUILD_REVISION: ${{ steps.rev.outputs.sha }}
        run: |
          Write-Host "VCPKG_ROOT       = $env:VCPKG_ROOT"
          Write-Host "JAVA_HOME        = $env:JAVA_HOME"
          Write-Host "OPENZEN_BUILD_REV = $env:OPENZEN_BUILD_REVISION"
          .\gradlew.bat --no-daemon dll upxCompress

      - name: Upload Injector EXE
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        uses: actions/upload-artifact@v4
        with:
          name: OpenNiloreLoader-${{ steps.rev.outputs.sha }}.exe
          path: build/dist/OpenNiloreLoader.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Injector mapping
        if: inputs.build_target == 'all' || inputs.build_target == 'injector'
        uses: actions/upload-artifact@v4
        with:
          name: OpenZen-${{ steps.rev.outputs.sha }}-injector-mapping.txt
          path: build/rename-mapping.txt
          if-no-files-found: error
          retention-days: 30
